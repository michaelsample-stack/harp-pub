# HARP - local development
#
# Paths are relative to the repo root. Nothing here touches GCP, so this runs
# with no credentials beyond the public BC endpoints.

client: harmac
environment: dev

paths:
  # The monthly input library. One folder per month, one folder per
  # submission inside it - a month arrives as -001, and a corrected month
  # arrives as -002 with the original left exactly as it was processed.
  #
  #     <intake>/2026-05/2026-05-001/
  #
  # A lot walkback reads across months from here: walking back from when a
  # lot finished can reach through several months of deliveries before the
  # mass is covered. Set it to a gs:// path in the cloud and nothing else
  # changes.
  intake: ./data/intake/monthly
  inbox:    ./data/inbox
  staging:  ./data/staging
  outbox:   ./data/outbox
  rejects:  ./data/rejects
  manifest: ./data/manifest

bigquery:
  enabled: false

sources:
  library:
    # Outside the repo. Months accumulate and they are client geometry, so
    # they do not belong in version control.
    path: ../harp-library

    # Nothing reaches the shelf without a person saying so. The eventual
    # intent is a service that promotes clean months itself; until the
    # cleaner is tuned for this data rather than for supplier submissions, a
    # human looks first.
    # Outside the library. The library is an archive of finished months and
    # nothing in it should need qualifying; a month that failed validation is
    # a work item and belongs where work items live.
    quarantine: ../harp-quarantine

    require_approval: true

    # Validate, clean, validate again, up to this many rounds. Required
    # findings still standing after the last one send the month to
    # quarantine rather than pending.
    max_passes: 3

    country_iso2: CA

    # Passed to eudr_clean. Every one of these changes what is being asserted
    # about a plot, so all are off until someone decides otherwise.
    clean:
      hole_mode: null
      fix_overlaps: false
      convert_degenerate_to_points: false
      convert_small_polygons: false
      remove_proximate_vertices: false

  species:
    # What was growing on each harvest area, from the Canadian species raster
    # and the US forest type raster. On by default; a run without Earth Engine
    # reachable says so and carries on without it.
    enabled: true
    # Pencilled in. Any registered Earth Engine project works - this is the
    # one the detection service runs from.
    project: eo-sandbox

  supply:
    # The month's work comes from the delivery record: what arrived, rather
    # than everything in the register. Toll chippers receive the client's own
    # logs and return chips, so a receipt from one resolves to the pool of
    # marks routed there rather than to the chipper's own town.
    toll_chippers:
      MIDISL: ["MIDISL", "MID ISLAND"]
      DCT: ["DCT", "CHAMBERS", "LADYSMITH", "JORDAN RIVER"]
      CWI-CC: ["COASTLAND", "CWI-CC"]
      FFP: ["FRANKLIN CUSTOM"]
      CAHOY: ["CHIPS AHOY"]
      LONGHOH: ["LONGHOH"]

  reference:
    # The supplier alias table, mill locations and stated areas. Shipped with
    # the package; set a folder here to use a different set. A file already
    # sitting in data/registry is preferred over the packaged copy either way,
    # so editing one locally does what you expect.
    path: ""

  gaps:
    # Estimate what the detection service and the species rasters could not
    # answer, from the nearest features that could.
    #
    # On. A deliverable with blank fields is not a deliverable, and the
    # services leave a few percent unanswered every month. Every filled
    # feature is marked on harp_estimated and its basis says so.
    enabled: true
    neighbours: 5
    max_km: 20
    # Above this share of the month, estimating is no longer filling gaps -
    # it is covering for something that went wrong earlier, and the run says
    # so loudly.
    warn_above: 0.15

  lots:
    # From the client's own master data table, 31 August 2026. Awaiting
    # confirmation - see the email to Angela.
    #
    # Cubic metres of chips per air-dry tonne of pulp. Cedar takes over half
    # again as much volume as fir for the same tonne of pulp, so the walkback
    # cannot be done on the total and apportioned after.
    chip_m3_per_adt:
      DFIR:   5.00
      HEMBAL: 5.50
      RCEDAR: 7.75

    # The client records this as 3.375 BDU/m3. Taken literally that is 3.7
    # tonnes of dry fibre in a cubic metre of chips - denser than solid wood,
    # and chips are mostly air. Used as m3 per BDU, which gives about 0.32
    # BDT/m3 and a chips-to-pulp ratio of 1.66:1. A kraft mill should show
    # near 2:1, so the inverted reading is the right one.
    chip_m3_per_bdu: 3.375

    # A bone dry unit is 2,400 lb.
    tonnes_per_bdu: 1.0886

    # The walkback covers twice the lot's requirement. Piles do not empty
    # cleanly, and over-declaring is the failure that survives an audit.
    walkback_multiple: 2.0

  ften:
    # Nanaimo Forest Products Ltd - verified against the live service.
    # Note "HARMAC" as a name filter returns nothing; always use the number.
    default_client_number: "00158809"
    district_field: GEOGRAPHIC_DISTRICT_NAME
    # Read by `harp ften` and `harp resolve`, deliberately not by `harp run`.
    #
    # It requires DISTURBANCE_START_DATE and DISTURBANCE_END_DATE, and the
    # register barely populates them - filtering 3,339 blocks to since-2024
    # left fifteen. Applying it to a month would drop most of it.
    #
    # Detection answers the same question better: a block that was not cut
    # shows no change in the window, which is evidence rather than a null
    # field.
    completion_rule:
      require_end_date: true
      require_start: true
      start_after: "2025-07-01"

  detection:
    # How far before the declared month detection looks.
    #
    # A chip delivered in May came from a log cut before May. Searching only
    # May finds harvest that has not been delivered yet and misses what fed
    # the month. The window reaches back this many months and still ends at
    # the month's end, because some of what a month delivers really was cut
    # within it.
    #
    # Two is a working assumption about turnaround, not a measurement. If a
    # month's detections cluster at the very start of its window, raise it.
    lag_months: 2
    # How HARP calls tracemark-eo. Undecided - library or deployed service.
    mode: unset

  supplier_file:
    accepted: [geojson, shp, gpkg, kml]

  hbs:
    # Public timber mark record. No credentials. Used whenever an identifier
    # fails the cutblock layer, to establish whether the land is Crown or
    # private and who holds the mark.
    enabled: true
    delay_seconds: 0.45

  private_marks:
    # BC scaled-timbermark extracts. A registry, not client data - the files
    # hold 1,907 marks across 23 districts, of which this client uses a few
    # dozen. Resolved parcels are cached per PID and shared across clients.
    #
    # The extracts are NOT cumulative: the most recently processed file covers
    # 27.7% of the year, so every file is unioned. Needs the bcparcel package.
    enabled: true
    extracts_dir: ./data/registry/bc_private_timber_marks

resolution:
  # A raw client list needs no curation. These only fill gaps in it.
  default_jurisdiction: BC
  cache: ./data/cache
  # Apply the completion rule to returned rows rather than in the query - a
  # date predicate forces a full scan of 222,129 blocks.
  apply_completion_rule: true
